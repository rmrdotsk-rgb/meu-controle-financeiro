spring.application.name=meu-controle-financeiro
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
server.port=${PORT:8080}
server.address=127.0.0.1

spring.datasource.url=jdbc:h2:file:./data/meucontrole;WRITE_DELAY=0
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=false

spring.jpa.hibernate.ddl-auto=validate
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.clean-disabled=true
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.thymeleaf.cache=false

spring.mvc.hiddenmethod.filter.enabled=false
server.error.whitelabel.enabled=false
server.error.include-message=never
server.error.include-stacktrace=never
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.http-only=true
server.servlet.session.timeout=30m
server.servlet.session.tracking-modes=cookie

# Demonstração local: habilite explicitamente e configure a senha no ambiente.
app.demo.enabled=${DEMO_ENABLED:false}
app.demo.email=${DEMO_EMAIL:demo@meucontrole.local}
app.demo.password=${DEMO_PASSWORD:}
