<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Cadastro de despesa pessoal">
    <title th:text="${modoEdicao ? 'Editar despesa' : 'Nova despesa'} + ' · Meu Controle Financeiro'">Nova despesa · Meu Controle Financeiro</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="app-shell">
    <div th:replace="~{fragments :: topbar('despesas')}"></div>

    <main class="form-page" id="conteudo" tabindex="-1">
        <p class="eyebrow">Despesas</p>
        <h1 th:text="${modoEdicao ? 'Editar despesa' : 'Nova despesa'}">Nova despesa</h1>

        <form class="expense-form" th:object="${despesa}" th:action="${modoEdicao} ? @{/despesas/{id}/editar(id=${despesa.id})} : @{/despesas}" method="post">
            <div class="field-group">
                <label for="descricao">Descrição</label>
                <input id="descricao" type="text" th:field="*{descricao}" th:attr="aria-invalid=${#fields.hasErrors('descricao')},aria-describedby=${#fields.hasErrors('descricao')} ? 'descricao-erro' : null" minlength="3" maxlength="120" placeholder="Ex.: Conta de luz" autocomplete="off" autofocus required>
                <small id="descricao-erro" class="field-error" th:if="${#fields.hasErrors('descricao')}" th:errors="*{descricao}">Informe uma descrição válida.</small>
            </div>

            <div class="form-grid">
                <div class="field-group">
                    <label for="valor">Valor (R$)</label>
                    <input id="valor" type="number" th:field="*{valor}" th:attr="aria-invalid=${#fields.hasErrors('valor')},aria-describedby=${#fields.hasErrors('valor')} ? 'valor-erro' : null" min="0.01" max="9999999999.99" step="0.01" placeholder="0,00" inputmode="decimal" required>
                    <small id="valor-erro" class="field-error" th:if="${#fields.hasErrors('valor')}" th:errors="*{valor}">Informe um valor válido.</small>
                </div>
                <div class="field-group">
                    <label for="categoria">Categoria</label>
                    <select id="categoria" th:field="*{categoria}" th:attr="aria-invalid=${#fields.hasErrors('categoria')},aria-describedby=${#fields.hasErrors('categoria')} ? 'categoria-erro' : null" required>
                        <option value="">Selecione uma categoria</option>
                        <option value="Alimentação">Alimentação</option>
                        <option value="Educação">Educação</option>
                        <option value="Transporte">Transporte</option>
                        <option value="Casa">Casa</option>
                        <option value="Saúde">Saúde</option>
                        <option value="Lazer">Lazer</option>
                        <option value="Outros">Outros</option>
                    </select>
                    <small id="categoria-erro" class="field-error" th:if="${#fields.hasErrors('categoria')}" th:errors="*{categoria}">Selecione uma categoria válida.</small>
                </div>
            </div>

            <div class="field-group">
                <label for="data">Data</label>
                <input id="data" type="date" th:field="*{data}" th:attr="aria-invalid=${#fields.hasErrors('data')},aria-describedby=${#fields.hasErrors('data')} ? 'data-erro' : null" required>
                <small id="data-erro" class="field-error" th:if="${#fields.hasErrors('data')}" th:errors="*{data}">Informe uma data válida.</small>
            </div>

            <div class="form-actions">
                <a class="button button-secondary" th:href="@{/despesas}">Cancelar</a>
                <button class="button button-primary" type="submit">Salvar</button>
            </div>
        </form>
    </main>
</div>
</body>
</html>
