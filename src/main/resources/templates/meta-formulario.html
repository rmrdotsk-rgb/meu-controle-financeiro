<!DOCTYPE html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title th:text="${modoEdicao} ? 'Editar meta | Meu Controle Financeiro' : 'Nova meta | Meu Controle Financeiro'"></title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body>
<div th:replace="~{fragments :: topbar('metas')}"></div><main class="form-page" id="conteudo" tabindex="-1"><p class="eyebrow">Objetivos financeiros</p><h1 th:text="${modoEdicao} ? 'Editar meta' : 'Nova meta'"></h1><p class="intro">Defina o que deseja alcançar. O valor guardado é informado separadamente, por aportes.</p>
<form class="expense-form" th:object="${meta}" th:action="${modoEdicao} ? @{/metas/{id}/editar(id=${meta.id})} : @{/metas}" method="post">
<div class="field-group"><label for="nome">Nome da meta</label><input id="nome" th:field="*{nome}" type="text" minlength="3" maxlength="80" placeholder="Ex.: Reserva de emergência" required th:attr="aria-invalid=${#fields.hasErrors('nome')},aria-describedby=${#fields.hasErrors('nome')} ? 'nome-erro' : null"><small id="nome-erro" class="field-error" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></small></div>
<div class="form-grid"><div class="field-group"><label for="valorAlvo">Valor desejado (R$)</label><input id="valorAlvo" th:field="*{valorAlvo}" type="number" inputmode="decimal" min="0.01" max="9999999999.99" step="0.01" required th:attr="aria-invalid=${#fields.hasErrors('valorAlvo')},aria-describedby=${#fields.hasErrors('valorAlvo')} ? 'valorAlvo-erro' : null"><small id="valorAlvo-erro" class="field-error" th:if="${#fields.hasErrors('valorAlvo')}" th:errors="*{valorAlvo}"></small></div><div class="field-group"><label for="dataLimite">Prazo</label><input id="dataLimite" th:field="*{dataLimite}" type="date" required th:attr="aria-invalid=${#fields.hasErrors('dataLimite')},aria-describedby=${#fields.hasErrors('dataLimite')} ? 'dataLimite-erro' : null"><small id="dataLimite-erro" class="field-error" th:if="${#fields.hasErrors('dataLimite')}" th:errors="*{dataLimite}"></small></div></div>
<div class="form-actions"><a class="button button-secondary" th:href="@{/metas}">Cancelar</a><button class="button button-primary" type="submit">Salvar meta</button></div></form></main></body></html>
