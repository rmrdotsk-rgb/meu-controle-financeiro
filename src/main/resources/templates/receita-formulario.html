<!DOCTYPE html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title th:text="${modoEdicao} ? 'Editar receita | Meu Controle Financeiro' : 'Nova receita | Meu Controle Financeiro'"></title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body>
<div th:replace="~{fragments :: topbar('receitas')}"></div>
<main class="form-page" id="conteudo" tabindex="-1"><p class="eyebrow">Receitas</p><h1 th:text="${modoEdicao} ? 'Editar receita' : 'Nova receita'"></h1><p class="intro">Registre apenas valores que realmente recebeu.</p>
<form class="expense-form" th:object="${receita}" th:action="${modoEdicao} ? @{/receitas/{id}/editar(id=${receita.id})} : @{/receitas}" method="post">
<div class="field-group"><label for="descricao">Descrição</label><input id="descricao" type="text" th:field="*{descricao}" minlength="3" maxlength="120" placeholder="Ex.: Salário de novembro" required th:attr="aria-invalid=${#fields.hasErrors('descricao')},aria-describedby=${#fields.hasErrors('descricao')} ? 'descricao-erro' : null"><small id="descricao-erro" class="field-error" th:if="${#fields.hasErrors('descricao')}" th:errors="*{descricao}"></small></div>
<div class="form-grid"><div class="field-group"><label for="valor">Valor (R$)</label><input id="valor" type="number" th:field="*{valor}" step="0.01" min="0.01" max="9999999999.99" inputmode="decimal" required th:attr="aria-invalid=${#fields.hasErrors('valor')},aria-describedby=${#fields.hasErrors('valor')} ? 'valor-erro' : null"><small id="valor-erro" class="field-error" th:if="${#fields.hasErrors('valor')}" th:errors="*{valor}"></small></div>
<div class="field-group"><label for="categoria">Tipo de receita</label><select id="categoria" th:field="*{categoria}" required th:attr="aria-invalid=${#fields.hasErrors('categoria')},aria-describedby=${#fields.hasErrors('categoria')} ? 'categoria-erro' : null"><option value="">Escolha</option><option value="Salário">Salário</option><option value="Freelance">Freelance</option><option value="Vendas">Vendas</option><option value="Outros">Outros</option></select><small id="categoria-erro" class="field-error" th:if="${#fields.hasErrors('categoria')}" th:errors="*{categoria}"></small></div></div>
<div class="field-group"><label for="data">Data em que recebeu</label><input id="data" type="date" th:field="*{data}" required th:attr="aria-invalid=${#fields.hasErrors('data')},aria-describedby=${#fields.hasErrors('data')} ? 'data-erro' : null"><small id="data-erro" class="field-error" th:if="${#fields.hasErrors('data')}" th:errors="*{data}"></small></div>
<div class="form-actions"><a class="button button-secondary" th:href="@{/receitas}">Cancelar</a><button class="button button-primary" type="submit">Salvar receita</button></div>
</form></main></body></html>
